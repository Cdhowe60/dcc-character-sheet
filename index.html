<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>DCC Character Sheet</title>
</head>
<body class="bg-light">
  <div class="container my-5">
    <h1 class="mb-4 text-center">DCC Character Sheet</h1>

    <form>
      <div class="accordion" id="characterSheetAccordion">

        <!-- Basic Info -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingInfo">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInfo" aria-expanded="true" aria-controls="collapseInfo">
              Basic Info
            </button>
          </h2>
          <div id="collapseInfo" class="accordion-collapse collapse show" aria-labelledby="headingInfo" data-bs-parent="#characterSheetAccordion">
            <div class="accordion-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="name" class="form-label">Character Name</label>
                  <input type="text" id="name" name="name" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="ac" class="form-label">Armor Class</label>
                  <input type="number" id="ac" name="ac" placeholder="12" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="hp" class="form-label">Hit Points</label>
                  <input type="number" id="hp" name="hp" placeholder="1" class="form-control">
                </div>
                <div class="col-md-6">
                  <label for="occupation" class="form-label">Occupation</label>
                  <input type="text" id="occupation" name="occupation" class="form-control">
                </div>
                <div class="col-md-3">
                  <label for="speed" class="form-label">Speed</label>
                  <input type="number" id="speed" name="speed" placeholder="30" class="form-control">
                </div>
                <div class="col-md-3">
                  <label for="initiative" class="form-label">Initiative</label>
                  <input type="number" id="initiative" name="initiative" placeholder="1" class="form-control">
                </div>
                <div class="col-md-3">
                  <label for="xp" class="form-label">XP</label>
                  <input type="number" id="xp" name="xp" placeholder="0" class="form-control">
                </div>
              </div>
              <fieldset class="mt-4">
                <legend class="col-form-label pt-0">Alignment</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" id="law" name="alignment" value="Law">
                  <label class="form-check-label" for="law">Law</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" id="neutral" name="alignment" value="Neutral">
                  <label class="form-check-label" for="neutral">Neutral</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" id="chaos" name="alignment" value="Chaos">
                  <label class="form-check-label" for="chaos">Chaos</label>
                </div>
              </fieldset>
            </div>
          </div>
        </div>

        <!-- Abilities -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingAbilities">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAbilities" aria-expanded="false" aria-controls="collapseAbilities">
              Abilities
            </button>
          </h2>
          <div id="collapseAbilities" class="accordion-collapse collapse" aria-labelledby="headingAbilities" data-bs-parent="#characterSheetAccordion">
            <div class="accordion-body">
              <div class="row g-3">
                <div class="col-md-2">
                  <label for="strengthPoints" class="form-label">Strength</label>
                  <input type="number" id="strengthPoints" name="strengthPoints" placeholder="10" class="form-control">
                </div>
                <div class="col-md-2">
                  <label for="agilityPoints" class="form-label">Agility</label>
                  <input type="number" id="agilityPoints" name="agilityPoints" placeholder="10" class="form-control">
                </div>
                <div class="col-md-2">
                  <label for="staminaPoints" class="form-label">Stamina</label>
                  <input type="number" id="staminaPoints" name="staminaPoints" placeholder="10" class="form-control">
                </div>
                <div class="col-md-2">
                  <label for="personalityPoints" class="form-label">Personality</label>
                  <input type="number" id="personalityPoints" name="personalityPoints" placeholder="10" class="form-control">
                </div>
                <div class="col-md-2">
                  <label for="intelligencePoints" class="form-label">Intelligence</label>
                  <input type="number" id="intelligencePoints" name="intelligencePoints" placeholder="10" class="form-control">
                </div>
                <div class="col-md-2">
                  <label for="luckPoints" class="form-label">Luck</label>
                  <input type="number" id="luckPoints" name="luckPoints" placeholder="10" class="form-control">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Saves -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingSaves">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSaves" aria-expanded="false" aria-controls="collapseSaves">
              Saves
            </button>
          </h2>
          <div id="collapseSaves" class="accordion-collapse collapse" aria-labelledby="headingSaves" data-bs-parent="#characterSheetAccordion">
            <div class="accordion-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="reflexSave" class="form-label">Reflex</label>
                  <input type="number" id="reflexSave" name="reflexSave" placeholder="10" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="fortitudeSave" class="form-label">Fortitude</label>
                  <input type="number" id="fortitudeSave" name="fortitudeSave" placeholder="10" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="willSave" class="form-label">Will</label>
                  <input type="number" id="willSave" name="willSave" placeholder="10" class="form-control">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Inventory -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingInventory">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInventory" aria-expanded="false" aria-controls="collapseInventory">
              Inventory & Notes
            </button>
          </h2>
          <div id="collapseInventory" class="accordion-collapse collapse" aria-labelledby="headingInventory" data-bs-parent="#characterSheetAccordion">
            <div class="accordion-body">
              <div class="mb-3">
                <label for="weapons" class="form-label">Weapons</label>
                <textarea id="weapons" name="weapons" rows="3" class="form-control" placeholder="Dagger -1 (1d4-1)"></textarea>
              </div>
              <div class="mb-3">
                <label for="equipment" class="form-label">Equipment</label>
                <textarea id="equipment" name="equipment" rows="5" class="form-control" placeholder="Starting Funds: 20 cp"></textarea>
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea id="notes" name="notes" rows="5" class="form-control" placeholder="Lucky sign, languages, abilities, etc."></textarea>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Submit -->
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>

    <footer class="mt-5 small text-muted">
      <p>Dungeon Crawl Classics and DCC RPG are trademarks of Goodman Games. For additional information, visit <a href="https://www.goodman-games.com">www.goodman-games.com</a>.</p>
      <p>This is simply a fan-made site used for the purpose of practicing website creation.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
